name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run backend test suite
        run: python -m pytest backend/tests -q

      - name: Verify the app imports cleanly
        run: python -c "from backend.main import app; print(app.title)"

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  secrets:
    name: Secrets — no secrets in the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert .env is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked in version control. Remove it immediately."
            exit 1
          fi
          echo "OK: no .env tracked"

      - name: Assert .gitignore covers build artifacts
        run: |
          for f in .env .venv/ backend/data/memoryos.db frontend/node_modules frontend/dist; do
            if ! grep -qF "$f" .gitignore; then
              echo "::error::.gitignore is missing an entry for $f"
              exit 1
            fi
          done
          echo "OK: .gitignore covers env, venv, data, node_modules, dist"
