# nginx config for the MemoryOS SPA.
#
# The single most important line here is `try_files $uri $uri/ /index.html`.
# The app uses React Router in BrowserRouter mode, so a user opening
# /governance directly requests a path that does not exist on disk. Without the
# fallback nginx returns 404 and the app appears broken on every deep link and
# every page refresh.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed asset filenames, so they are safe to cache
    # aggressively. index.html must NOT be cached or clients pin an old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Don't advertise the nginx version.
    server_tokens off;

    # Conservative baseline. Relax per-route as needed.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
